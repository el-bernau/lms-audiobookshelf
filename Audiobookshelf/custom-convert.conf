# Remote-streamable transcode rules for Audiobookshelf files.
#
# LMS ships transcode rules for these formats, but they read a local file
# ($FILE$ via sox/flac/lame) and are rejected for a remote HTTP stream
# ("no available stream mode supported: R"), or need a binary that may be
# absent (e.g. lame). When the target player cannot natively decode the
# source format, LMS then finds no usable command and *skips the track*.
#
# ffmpeg reads the remote URL directly ($URL$) and emits mp3, which every
# player supports, so there is always a valid command. Players that *can*
# decode the source natively still use LMS's cheaper passthrough rule.
# "# RT:{START=-ss %s}" advertises remote (R) + time-seek (T), mapping a
# resume seek onto ffmpeg's -ss.

mp4 mp3 * *
	# RT:{START=-ss %s}
	[ffmpeg] -v quiet $START$ -i $URL$ -vn -f mp3 -b:a 128k -

ogg mp3 * *
	# RT:{START=-ss %s}
	[ffmpeg] -v quiet $START$ -i $URL$ -vn -f mp3 -b:a 128k -

aac mp3 * *
	# RT:{START=-ss %s}
	[ffmpeg] -v quiet $START$ -i $URL$ -vn -f mp3 -b:a 128k -

flc mp3 * *
	# RT:{START=-ss %s}
	[ffmpeg] -v quiet $START$ -i $URL$ -vn -f mp3 -b:a 128k -
